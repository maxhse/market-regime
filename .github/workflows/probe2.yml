name: probe2
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://rate.bot.com.tw/xrt/flcsv/0/L6M/USD" "https://rate.bot.com.tw/xrt/flcsv/0/2026-10/USD" "https://rate.bot.com.tw/xrt/flcsv/0/day"; do
            echo "== $u"; curl -sL -m 60 -A "Mozilla/5.0" "$u" -o o.bin -w "%{http_code} %{size_download} %{content_type}\n"; head -c 500 o.bin | iconv -f utf-8 -t utf-8 -c; echo; wc -l o.bin; tail -2 o.bin; done
