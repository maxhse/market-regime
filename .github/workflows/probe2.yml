name: probe2
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -m 90 "https://cpx.cbc.gov.tw/API/DataAPI/Get?FileName=BP01D01" -o o.json
          python3 - <<'PY'
          import json
          j=json.load(open("o.json",encoding="utf-8-sig"))
          print(list(j.keys())); m=j["meta"]; print({k:(str(v)[:200]) for k,v in m.items()})
          d=j.get("data") or j.get("Data")
          print(type(d), (list(d.keys())[:10] if isinstance(d,dict) else len(d)))
          s=json.dumps(d,ensure_ascii=False); print(s[:1500]); print("...", s[-800:])
          PY
