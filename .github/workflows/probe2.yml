name: probe2
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: python engine/tdcc.py probe 2330; python engine/tdcc.py probe 3017; python engine/tdcc.py weekly; head -3 data/market/tdcc/*.csv; wc -l data/market/tdcc/*.csv
