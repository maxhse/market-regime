name: probe2
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "2014/01/02 2014/01/31" "2026/10/20 2026/11/23"; do set -- $r
            echo "== $1 $2"; curl -sL -m 60 -A "Mozilla/5.0" -X POST https://www.taifex.com.tw/cht/3/dailyFXRateDown -d "queryStartDate=$1&queryEndDate=$2" -o o.bin -w "%{http_code} %{size_download} %{content_type}\n"; iconv -f big5 -t utf-8 -c o.bin | head -4; iconv -f big5 -t utf-8 -c o.bin | tail -3; done
