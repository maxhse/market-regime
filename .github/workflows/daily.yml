name: daily
on:
  schedule:
    - cron: "40 6 * * 1-5"    # 台北 14:40（收盤後）
    - cron: "10 11 * * 1-5"   # 台北 19:10（補抓）
  workflow_dispatch:
  push:
    paths: ["engine/**", ".github/workflows/daily.yml"]
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python engine/fetch_public.py
      - run: python engine/build.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/public docs/latest.json
          git diff --cached --quiet || git commit -m "每日更新 $(TZ=Asia/Taipei date +%F)"
          git pull -q --rebase origin main
          git push
