name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in "2026/11/02 2026/11/19" "2023/11/01 2023/11/10" "2020/03/02 2020/03/10" "2017/05/15 2017/05/25" "2015/01/05 2015/01/10" "2010/01/04 2010/01/10"; do
            set -- $d; echo "== $1 ~ $2"
            curl -s -m 60 -X POST https://www.taifex.com.tw/cht/3/futDataDown -d "down_type=1&commodity_id=TX&queryStartDate=$1&queryEndDate=$2" | iconv -f big5 -t utf-8 -c | head -8
            sleep 3
          done
