name: probe
on:
  push:
    paths: ["engine/probe_taifex.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python engine/probe_taifex.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/probe
          git commit -m "探測期交所 OpenAPI" || true
          git pull -q --rebase origin main
          git push
