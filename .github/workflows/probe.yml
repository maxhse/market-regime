name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  tx:
    runs-on: ubuntu-latest
    concurrency: backfill-tx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: python engine/tx_hist.py 2010-01
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add data/market/tx_raw.csv
          git commit -m "台指期日線歷史" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
